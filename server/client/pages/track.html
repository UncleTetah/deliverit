<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track — DeliverIt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">
        <i class="fa-solid fa-truck-fast"></i> DeliverIt
      </a>
      <button class="nav-toggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-delivery.html">New Delivery</a>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top:2rem; padding-bottom:3rem;">
    <header class="page-header">
      <div>
        <h1>Track Delivery</h1>
        <p>Enter a delivery ID to see its live status and history.</p>
      </div>
    </header>

    <form id="track-form" class="inline-form">
      <input id="delivery-id" placeholder="Paste delivery ID (e.g. 3f2a1b…)" required>
      <button type="submit" class="btn btn-primary">
        <i class="fa-solid fa-magnifying-glass"></i> Track
      </button>
    </form>

    <div id="map" class="map"></div>
    <h2 style="font-size:1.15rem; margin-top:2rem;">Tracking History</h2>
    <div id="timeline" class="timeline">
      <p class="muted">No delivery loaded yet.</p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/map.js"></script>
  <script src="../js/pages/track.js"></script>
</body>
</html>
