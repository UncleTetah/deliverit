<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track — DeliverIt</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="brand">
        <i class="fa-solid fa-truck-fast"></i> DeliverIt
      </a>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>Track Delivery</h1>
    </header>

    <form id="track-form" class="card inline-form">
      <input id="delivery-id" placeholder="Enter Delivery ID" required>
      <button type="submit" class="btn btn-primary">Track</button>
    </form>

    <div id="map" class="map"></div>
    <div id="timeline" class="timeline"></div>
  </main>

  <!-- Leaflet JS — MUST be loaded BEFORE map.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/map.js"></script>
  <script src="../js/pages/track.js"></script>
</body>
</html>
